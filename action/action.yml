name: "Revalex Regression Gate"
description: "Fail the build when your AI agent's eval pass-rates regress versus baseline. Never ship a broken prompt again."
branding:
  icon: "shield"
  color: "purple"

inputs:
  api-key:
    description: "Revalex project API key (store as a repo secret)"
    required: true
  experiment-id:
    description: "The candidate experiment to gate (created + evaluated by your harness step)"
    required: true
  baseline-experiment-id:
    description: "Explicit baseline experiment. Omit to auto-use the latest completed experiment on the same dataset."
    required: false
    default: ""
  max-regression-pp:
    description: "Fail if any evaluator's pass rate drops more than this many percentage points"
    required: false
    default: "5"
  min-pass-rate:
    description: "Optional floor (0..1): fail if any evaluator's candidate pass rate is below this"
    required: false
    default: ""
  behavioral-gate:
    description: "Fail the gate when NEW risky behavior appears vs baseline (the Behavioral Diff Gate). Set 'false' for scores-only gating."
    required: false
    default: "true"
  fail-on-unclassified:
    description: "Strict mode: NEW tools with no risk classification also fail the gate"
    required: false
    default: "false"
  strict-safety:
    description: "Fail unless an action-safety check actually produced verdicts on the candidate (a skipped safety gate never passes)"
    required: false
    default: "false"
  api-url:
    description: "Revalex API base URL. Override only for self-hosted or local dev."
    required: false
    # Production. A localhost default meant the documented three-input snippet
    # could never work on a GitHub runner — nothing listens on :4000 there, so
    # curl failed and `set -euo pipefail` aborted the step before any verdict.
    default: "https://api.revalex.com"
  github-token:
    description: "Pass ${{ github.token }} to also post the verdict as a PR comment"
    required: false
    default: ""

outputs:
  passed:
    description: "true/false gate verdict"
    value: ${{ steps.gate.outputs.passed }}

runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      env:
        REVALEX_API_KEY: ${{ inputs.api-key }}
        EXPERIMENT_ID: ${{ inputs.experiment-id }}
        BASELINE_ID: ${{ inputs.baseline-experiment-id }}
        MAX_REGRESSION_PP: ${{ inputs.max-regression-pp }}
        MIN_PASS_RATE: ${{ inputs.min-pass-rate }}
        BEHAVIORAL_GATE: ${{ inputs.behavioral-gate }}
        FAIL_ON_UNCLASSIFIED: ${{ inputs.fail-on-unclassified }}
        STRICT_SAFETY: ${{ inputs.strict-safety }}
        API_URL: ${{ inputs.api-url }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        BODY=$(jq -n \
          --arg exp "$EXPERIMENT_ID" \
          --arg base "$BASELINE_ID" \
          --arg maxreg "$MAX_REGRESSION_PP" \
          --arg minpr "$MIN_PASS_RATE" \
          --arg bgate "$BEHAVIORAL_GATE" \
          --arg unclass "$FAIL_ON_UNCLASSIFIED" \
          --arg strict "$STRICT_SAFETY" \
          '{experimentId: $exp, maxRegressionPp: ($maxreg | tonumber),
            behavioralGate: ($bgate == "true"), failOnUnclassified: ($unclass == "true"),
            strictSafety: ($strict == "true")}
           + (if $base != "" then {baselineExperimentId: $base} else {} end)
           + (if $minpr != "" then {minPassRate: ($minpr | tonumber)} else {} end)')

        # `|| true` so a transport failure does NOT get eaten by pipefail
        # before we can explain it. A gate that dies with a bare non-zero exit
        # is indistinguishable from a gate that found a real regression.
        HTTP_CODE=$(curl -sS --max-time 120 -o /tmp/revalex_check.json -w "%{http_code}" \
          -X POST "$API_URL/v1/checks" \
          -H "authorization: Bearer $REVALEX_API_KEY" \
          -H "content-type: application/json" \
          -d "$BODY" 2>/tmp/revalex_curl_err.txt) || true

        if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
          echo "::error::Revalex could not REACH the API at $API_URL — this is a connectivity/config problem, not a regression. $(cat /tmp/revalex_curl_err.txt 2>/dev/null | head -2)"
          echo "::error::Check the api-url input (default https://api.revalex.com) and that the runner has network access."
          exit 1
        fi

        if [ "$HTTP_CODE" -ge 400 ]; then
          # A proxy/gateway (502/503/504) or WAF returns an HTML body, not our
          # JSON error envelope. jq would fail to parse it and — under
          # `set -euo pipefail` — that assignment would abort the whole step
          # with a raw jq parse error and no useful diagnostic. `|| true`
          # keeps the step alive; the fallback prints a body snippet so the
          # developer sees WHAT came back (a gateway page) instead of a
          # cryptic jq failure.
          DETAIL=$(jq -r '.error.message // empty' /tmp/revalex_check.json 2>/dev/null || true)
          if [ -z "$DETAIL" ]; then
            DETAIL="non-JSON response (likely a proxy/gateway page): $(head -c 200 /tmp/revalex_check.json 2>/dev/null | tr '\n' ' ')"
          fi
          if [ "$HTTP_CODE" = "402" ]; then
            echo "::error::Revalex: $DETAIL (plan/quota — the gate did not run)"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "::error::Revalex: unauthorized — check the api-key secret. The gate did not run."
          else
            echo "::error::Revalex check request failed ($HTTP_CODE): $DETAIL"
          fi
          exit 1
        fi

        # A 2xx with a missing/empty/non-JSON body must FAIL CLOSED with a
        # clear message, not abort on a raw jq error under set -e. `|| true`
        # keeps the step alive; PASSED stays empty and the "!= true" gate
        # below blocks the deploy — an unreadable verdict is not a pass.
        PASSED=$(jq -r 'if (.passed|type)=="boolean" then (.passed|tostring) else empty end' /tmp/revalex_check.json 2>/dev/null || true)
        if [ -z "$PASSED" ]; then
          echo "::error::Revalex returned $HTTP_CODE but no readable verdict (empty or non-JSON body). Failing closed — an unverifiable gate is not a pass."
          exit 1
        fi
        CAND=$(jq -r '.candidate.versionLabel // "unknown"' /tmp/revalex_check.json 2>/dev/null || echo "unknown")
        BASE=$(jq -r '.baseline.versionLabel // "none (first run)"' /tmp/revalex_check.json 2>/dev/null || echo "none")
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

        {
          echo "## 🛡 Revalex Regression Gate — $([ "$PASSED" = "true" ] && echo '✅ PASSED' || echo '❌ FAILED')"
          echo ""
          echo "**Candidate:** \`$CAND\` · **Baseline:** \`$BASE\`"
          echo ""
          echo "| Evaluator | Baseline | Candidate | Δ | Verdict |"
          echo "|---|---|---|---|---|"
          jq -r '.verdicts[] | "| \(.evaluator) | \(if .passRateBaseline != null then ((.passRateBaseline*100|round|tostring) + "%") else "—" end) | \(if .passRateCandidate != null then ((.passRateCandidate*100|round|tostring) + "%") else "—" end) | \(if .deltaPp != null then ((if .deltaPp >= 0 then "+" else "" end) + (.deltaPp|round|tostring) + "pp") else "—" end) | \(if .ok then "✅" else "❌ " + .reason end) |"' /tmp/revalex_check.json
          REG_COUNT=$(jq -r '.regressions | length' /tmp/revalex_check.json)
          if [ "$REG_COUNT" -gt 0 ]; then
            echo ""
            echo "### ⚠ $REG_COUNT regression(s)"
            jq -r '.regressions[] | "- **\(.evaluator)** on `\(.input)`\n  - before: \(.before)\n  - after: \(.after)"' /tmp/revalex_check.json
          fi
          BEH_COUNT=$(jq -r '.behavior.findings // [] | length' /tmp/revalex_check.json)
          if [ "$BEH_COUNT" -gt 0 ]; then
            echo ""
            echo "### 🧭 Behavioral findings (what the agent DOES changed)"
            jq -r '.behavior.findings[] | "- \(if .failing then "❌" else "ℹ️" end) \(.reason)"' /tmp/revalex_check.json
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # Console output too
        jq -r '.verdicts[] | "\(if .ok then "PASS" else "FAIL" end)  \(.evaluator): \(.reason)"' /tmp/revalex_check.json

        # PR-native report: post the same verdict as a PR comment.
        if [ -n "$GH_TOKEN" ] && [ -n "${PR_NUMBER:-}" ]; then
          BODY_MD=$(cat "$GITHUB_STEP_SUMMARY")
          jq -n --arg body "$BODY_MD" '{body: $body}' > /tmp/revalex_comment.json
          curl -sS -o /dev/null -X POST \
            -H "authorization: Bearer $GH_TOKEN" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -d @/tmp/revalex_comment.json || echo "::warning::could not post PR comment"
        fi

        if [ "$PASSED" != "true" ]; then
          echo "::error::Revalex gate failed — eval pass rates regressed beyond threshold. See the job summary."
          exit 1
        fi
        echo "Revalex gate passed ✅"
